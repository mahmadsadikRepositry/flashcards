<section class="card-list-section" aria-labelledby="card-list-title">
  <h3 id="card-list-title">Cards</h3>
  @if (deck().cards.length > 0) {
    <mat-list>
      @for (card of deck().cards; track card.id) {
        <mat-list-item>
          <span matListItemTitle class="card-front">{{ card.question }}</span>
          <span matListItemMeta class="card-actions">
            <button
              mat-icon-button
              type="button"
              [attr.aria-label]="'Edit ' + card.question"
              (click)="editCard(card.id)"
            >
              <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                <path
                  d="M4 16.5V20h3.5L18.8 8.7l-3.5-3.5L4 16.5Zm17.7-10.2a.9.9 0 0 0 0-1.3l-2.2-2.2a.9.9 0 0 0-1.3 0l-1.7 1.7 3.5 3.5 1.7-1.7Z"
                />
              </svg>
            </button>
            <button
              mat-icon-button
              type="button"
              [attr.aria-label]="'Delete ' + card.question"
              (click)="deleteCard(card.id, card.question)"
            >
              <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                <path
                  d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12ZM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4Z"
                />
              </svg>
            </button>
          </span>
        </mat-list-item>
      }
    </mat-list>
  } @else {
    <p class="empty-list">No cards yet.</p>
  }
</section>
