@if (deckStore.activeDeck(); as deck) {
  <section class="deck-view" aria-labelledby="deck-title">
    <header class="deck-heading">
      <div>
        <p class="eyebrow">{{ deck.description }}</p>
        <h2 id="deck-title">{{ deck.title }}</h2>
      </div>
      <span class="card-count">{{ deck.cards.length }} cards</span>
    </header>

    <div class="deck-toolbar" role="toolbar" aria-label="Deck actions">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search cards</mat-label>
        <input matInput type="search" />
      </mat-form-field>
      <div class="toolbar-actions">
        <button mat-stroked-button type="button">Shuffle</button>
        <button mat-flat-button type="button" (click)="createCard(deck.id)">New Card</button>
      </div>
    </div>

    <div class="study-area">
      @if (currentCard(); as card) {
        <app-study-card #studyCard [card]="card" />
        <div class="study-controls" aria-label="Study controls">
          <button mat-stroked-button type="button" (click)="moveCard(-1)">Previous</button>
          <button mat-flat-button type="button" (click)="studyCard.toggle()">Flip</button>
          <button mat-stroked-button type="button" (click)="moveCard(1)">Next</button>
        </div>
      } @else {
        <p class="no-cards">Add a card to start studying.</p>
      }
    </div>

    <app-card-list [deck]="deck" />
  </section>
}
