<app-header />

<div class="workspace">
  <app-deck-list />
  <main class="main-content">
    @if (deckStore.decks().length > 0) {
      <app-deck-view />
    } @else {
      <app-empty-state
        icon="style"
        heading="No decks yet"
        message="Create a deck to start organizing your flashcards."
        actionLabel="Create your first deck"
        (action)="createDeck()"
      />
    }
  </main>
</div>

<app-footer />
